<div 
  id="status-badge-{{ job_id }}" 
  x-data="{ editing: false }" 
  style="display: inline-flex; align-items: center; gap: 4px;"
>
  <template x-if="!editing">
    <span 
      class="badge {{ badge_class }}" 
      @click="editing = true" 
      style="cursor: pointer; user-select: none;"
      title="Click to change status"
    >
      {{ status|upper }} ▾
    </span>
  </template>

  <template x-if="editing">
    <select 
      name="status" 
      class="form-input" 
      style="min-height: 28px; height: 28px; padding: 2px 6px; font-size: 0.75rem; font-family: var(--font-mono); font-weight: 600; width: auto;"
      hx-post="/jobs/{{ job_id }}/status" 
      hx-target="#status-badge-{{ job_id }}" 
      hx-swap="outerHTML"
      @blur="editing = false"
      @change="editing = false"
    >
      {% for st in status_stages %}
        <option value="{{ st }}" {% if status == st %}selected{% endif %}>{{ st }}</option>
      {% endfor %}
      <option value="Cancelled" {% if status == 'Cancelled' %}selected{% endif %}>Cancelled</option>
    </select>
  </template>
</div>
