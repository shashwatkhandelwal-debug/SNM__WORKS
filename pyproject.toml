[project]
name = "snm-works"
version = "0.1.0"
description = "SNM Works technical textiles management system for Swadeshi Niwar Mills"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.29",
    "python-jose[cryptography]>=3.3",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "reportlab>=4.2",
    "Pillow>=10.0",
    "supabase>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "anyio>=4.4",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["auth*", "textiles*", "routers*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]